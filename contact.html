    <!-- Class 12: Step 1: a typeface I choose-->

<body>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="music.html">Music</a></li>
            <!-- Class 16: Step 1: the contact link -->
            <li><a href="contact.html" class="current">Contact</a></li>
            <!-- Class 15: step 3: the theme button -->
            <li><button id="theme-toggle" type="button">Dark</button></li>
        </ul>
    </nav> 
    <!-- Class 11: Step2: the page content -->
    <header>
        <!-- Class 12: Step 3: an image-->
        <img src="images/me.jpg" alt = "Portrait of Justin James" class ="portrait">
        <!-- Lab 12 · Task 1: group the text so it stacks beside the photo -->
        <div>
           <h1>Contact</h1>
           <!-- Lab 11 · Task 1: -->
           <p>Questions about my experience at Le Moyne, coursework or anything else.</p>
        </div>

       
    </header>
    <main>
       <!-- Class 16: Step 2: a form -->
        <form id="contact-form">
            <p>
                <label for="name">Your Name</label>
                <input id="name" name="name" type="text" required>
            </p>
            <p>
                <label for="email">Your Email</label>
                <input id="email" name="email" type="email" required>
            </p>
            <p>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </p>

            <button type="submit">Send</button>
        </form>

        <p id = "form-status" role="status"></p>
    </main>

    <!-- Lab 12 · Task 3: two things in the footer -->
    <footer>
        <!-- Class 15: step 2: the year, written by JavaScript -->
        <p>© <span id="year"></span> Justin James</p>

        <!-- Lab 15: Task 5: Back to Top button -->
         <button id="back-to-top" type="button">Back to Top</button>
        <!-- Lab 11 · Task 3: -->
        <a href="https://github.com/JustinJames06" target="_blank" rel="noopener">GitHub</a>

    </footer>
